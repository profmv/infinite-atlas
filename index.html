<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Endless, continuous zoom into a fractal world: every shape you see keeps its form and sprouts finer detail as you descend.">
<title>Infinite Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL canvas, cartographic readout top-left, glass control bar pinned bottom. */
  :root {
    --ink: #eef2f6;
    --ink-dim: #9aa6b4;
    --glass: rgba(10, 13, 18, 0.6);
    --edge: rgba(200, 214, 230, 0.16);
    --accent: #f0c27a;
    --void: #05070b;
    color-scheme: dark;
    --display: "Cormorant", "Iowan Old Style", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    overflow: hidden;
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: var(--void); }

  #fallback {
    position: fixed; inset: 0;
    display: grid; place-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; color: var(--ink-dim); font-size: 13px; line-height: 1.6;
  }

  /* ---- readout ---- */
  #readout {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    padding-block: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    display: grid; gap: 6px;
    transition: opacity 700ms ease;
  }
  #readout h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(22px, 4.6vw, 32px);
    letter-spacing: 0.03em;
    text-wrap: balance;
    color: var(--ink);
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.8);
  }
  .meta {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
  }
  .meta b { font-weight: 500; color: var(--ink); }

  /* ---- control bar ---- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: linear-gradient(to top, rgba(5, 7, 11, 0.78), rgba(5, 7, 11, 0));
    transition: opacity 700ms ease;
  }
  #bar .inner {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 20px;
    max-width: 980px; margin: 0 auto;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--edge);
  }
  @media (min-width: 620px) {
    #bar .inner { border: 1px solid var(--edge); border-radius: 14px; margin-bottom: 16px; padding-block: 14px; }
  }

  #bar label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); white-space: nowrap;
  }
  #speed {
    flex: 1 1 160px; min-width: 0;
    accent-color: var(--accent);
    height: 22px; cursor: ew-resize;
  }
  #rate {
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--ink); min-width: 10.5ch; text-align: right; white-space: nowrap;
  }
  button, select {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); background: rgba(240, 194, 122, 0.1);
    border: 1px solid var(--edge); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease;
  }
  select { padding-right: 8px; }
  select option { background: #10141b; color: var(--ink); }
  button:hover, select:hover { background: rgba(240, 194, 122, 0.2); border-color: rgba(240, 194, 122, 0.5); }
  .group { display: flex; align-items: center; gap: 10px; }
  #hint {
    flex: 0 0 100%; margin: 0;
    font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim);
  }

  :is(button, input, select, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .veiled { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="readout">
  <h1>Infinite Atlas</h1>
  <p class="meta" id="scale">charting</p>
  <p class="meta" id="strata"></p>
</div>

<div id="bar">
  <div class="inner">
    <div class="group">
      <label for="model">Model</label>
      <select id="model">
        <option value="relief">Relief</option>
        <option value="textured">Relief + textures</option>
        <option value="julia">Julia spiral</option>
      </select>
    </div>
    <label for="speed">Zoom speed</label>
    <input id="speed" type="range" min="0" max="1000" step="1" value="250" aria-describedby="rate">
    <span id="rate">&mdash;</span>
    <button id="reseed" type="button">New world</button>
    <p id="hint">Space pauses the descent &middot; R charts a new world &middot; M switches model</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });

  if (!gl) {
    canvas.remove();
    var f = document.createElement("div");
    f.id = "fallback";
    f.textContent = "This animation needs WebGL2, which this browser did not provide.";
    document.body.appendChild(f);
    document.getElementById("bar").remove();
    return;
  }

  /* ------------------------------------------------------------------ *
   * How the endless relief works.
   *
   * The world is ONE fractal height field h, the sum of infinitely many
   * octaves of gradient noise, each twice as fine and A times as tall as
   * the one above. The coastline (h = 0) and the contour lines are level
   * sets of that single field, so zooming never replaces them: a shape on
   * screen keeps its form while each new octave adds bays, ridges and
   * finer contours to it, exactly as a microscope reveals more of what
   * was already there.
   *
   * Only a window of octaves is evaluated per pixel. Octaves too fine to
   * see are not drawn yet; octaves much coarser than the screen are folded
   * into a quadratic Taylor patch (value, gradient, Hessian at the centre)
   * computed in JS doubles. The shader sees the field normalised by A^depth,
   * so all numbers stay near 1 at any depth, and every layer keeps its
   * own small coordinate frame, so float precision never runs out.
   *
   * The camera steers along the coastline, so the descent always stays
   * on the boundary where the fractal detail lives.
   * ------------------------------------------------------------------ */

  var KC = 11;              // live octaves coarser than the screen
  var KF = 5;               // live octaves finer than the screen
  var N = KC + KF + 1;      // live octave layers in the shader
  var BASE_FREQ = 3.0;      // noise cells per screen unit at u = 0
  var A = 0.62;             // amplitude ratio per octave (roughness)
  var LOG2A = Math.log2(A);
  var QA = 0.06;            // hue variation per octave
  var COORD0 = 4096;        // layer frames live around here (keeps ints positive)

  var FAMILIES = ["nebula", "relief", "rivers", "tissue", "starfield", "crystals", "currents"];
  var MODELS = { relief: "Relief", textured: "Relief + textures", julia: "Julia spiral" };

  var VERT = [
    "#version 300 es",
    "void main() {",
    "  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);",
    "  gl_Position = vec4(p, 0.0, 1.0);",
    "}"
  ].join("\n");

  var COMMON = [
    "#define TAU 6.283185307179586",
    "vec3 hue3(float h){ return 0.5 + 0.5 * cos(TAU * (h + vec3(0.0, 0.333, 0.667))); }",
    "// t runs from shadow (0) to highlight (1) inside one hue family.",
    "vec3 pal(float h, float t){",
    "  vec3 c = hue3(h + 0.12 * t);",
    "  float l = dot(c, vec3(0.299, 0.587, 0.114));",
    "  c = mix(vec3(l), c, 0.72);",
    "  return c * (0.08 + 1.05 * t);",
    "}"
  ].join("\n");

  var FIELD_FRAG = [
    "#version 300 es",
    "precision highp float;",
    "precision highp int;",
    "#define N " + N,
    "#define KF " + KF.toFixed(1),
    "#define QA " + QA.toFixed(4),
    COMMON,
    "out vec4 fragColor;",
    "uniform vec2 uRes;",
    "uniform float uTime, uFade, uB, uLogA, uEfr, uTex;",
    "uniform float uU[N];",
    "uniform ivec2 uCi[N];",
    "uniform vec2 uCf[N];",
    "uniform vec2 uR[N];",
    "uniform uint uSeed[N];",
    "uniform float uFam[N];",
    "uniform float uTSeed[N];",
    "uniform vec3 uP, uPM, uQ, uQM; // folded coarse octaves: value, gradient, Hessian",
    "",
    "// Integer hash (pcg2d), mirrored bit-for-bit in JS so the CPU knows",
    "// exactly where the coastline is.",
    "uvec2 pcg2d(uvec2 v){",
    "  v = v * 1664525u + 1013904223u;",
    "  v.x += v.y * 1664525u; v.y += v.x * 1664525u;",
    "  v ^= (v >> 16u);",
    "  v.x += v.y * 1664525u; v.y += v.x * 1664525u;",
    "  v ^= (v >> 16u);",
    "  return v;",
    "}",
    "vec2 hgrad(ivec2 i, uint seed){",
    "  uvec2 h = pcg2d(uvec2(i) + uvec2(seed, seed * 747796405u));",
    "  return vec2(h) * 4.656612873077393e-10 - 1.0;",
    "}",
    "// Gradient noise with analytic derivatives; ci is the integer part of",
    "// the layer frame, p the small fractional part plus the screen offset.",
    "vec3 noised(ivec2 ci, vec2 p, uint seed){",
    "  vec2 fl = floor(p); ivec2 i = ci + ivec2(fl); vec2 f = p - fl;",
    "  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);",
    "  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);",
    "  vec2 ga = hgrad(i, seed), gb = hgrad(i + ivec2(1, 0), seed);",
    "  vec2 gc = hgrad(i + ivec2(0, 1), seed), gd = hgrad(i + ivec2(1, 1), seed);",
    "  float va = dot(ga, f), vb = dot(gb, f - vec2(1.0, 0.0));",
    "  float vc = dot(gc, f - vec2(0.0, 1.0)), vd = dot(gd, f - vec2(1.0, 1.0));",
    "  float k0 = va - vb - vc + vd;",
    "  return 1.4 * vec3(va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k0,",
    "    ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd) + du * (u.yx * k0 + vec2(vb, vc) - va));",
    "}",
    "",
    "// ---- surface textures (Relief + textures model) ----",
    "float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }",
    "vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }",
    "float gnoise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);",
    "  float va = dot(hash22(i) * 2.0 - 1.0, f);",
    "  float vb = dot(hash22(i + vec2(1.0, 0.0)) * 2.0 - 1.0, f - vec2(1.0, 0.0));",
    "  float vc = dot(hash22(i + vec2(0.0, 1.0)) * 2.0 - 1.0, f - vec2(0.0, 1.0));",
    "  float vd = dot(hash22(i + vec2(1.0, 1.0)) * 2.0 - 1.0, f - vec2(1.0, 1.0));",
    "  return mix(mix(va, vb, u.x), mix(vc, vd, u.x), u.y) * 1.6;",
    "}",
    "float fbm3(vec2 p){",
    "  float s = 0.0, a = 0.5;",
    "  for (int i = 0; i < 3; i++) { s += a * gnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 11.7; a *= 0.5; }",
    "  return s;",
    "}",
    "mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }",
    "float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }",
    "float sdHex(vec2 p, float r){ p = abs(p); return max(p.x * 0.8660254 + p.y * 0.5, p.y) - r; }",
    "vec3 voro(vec2 x, out vec2 id, out vec2 rc){",
    "  vec2 n = floor(x), f = fract(x);",
    "  float d1 = 8.0, d2 = 8.0;",
    "  id = n; rc = vec2(0.0);",
    "  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {",
    "    vec2 g = vec2(float(i), float(j));",
    "    vec2 r = g + 0.1 + 0.8 * hash22(n + g) - f;",
    "    float d = dot(r, r);",
    "    if (d < d1) { d2 = d1; d1 = d; id = n + g; rc = r; } else if (d < d2) { d2 = d; }",
    "  }",
    "  return vec3(sqrt(d1), sqrt(d2), 0.0);",
    "}",
    "float flake(vec2 p, float k, float br, float ang){",
    "  float seg = TAU / k;",
    "  float a = atan(p.y, p.x), r = length(p);",
    "  a = abs(mod(a + seg * 0.5, seg) - seg * 0.5);",
    "  p = vec2(cos(a), sin(a)) * r;",
    "  float d = sdSeg(p, vec2(0.0), vec2(1.0, 0.0));",
    "  vec2 bd = vec2(cos(ang), sin(ang));",
    "  for (int j = 0; j < 3; j++) {",
    "    float fj = float(j);",
    "    vec2 o = vec2(0.28 + 0.24 * fj, 0.0);",
    "    d = min(d, sdSeg(p, o, o + bd * br * (1.0 - 0.28 * fj)));",
    "  }",
    "  return min(d, abs(sdHex(p, 0.16)));",
    "}",
    "// One texture octave. Returns structure colour and coverage.",
    "vec4 texLayer(int fam, vec2 x, float seed, float hue, float px){",
    "  vec2 p = x + seed * vec2(13.7, 7.3);",
    "  vec3 c; float st = 0.0;",
    "  if (fam == 0) {",
    "    vec2 q = vec2(fbm3(p * 0.8), fbm3(p * 0.8 + vec2(5.2, 1.3)));",
    "    float n = fbm3(p * 0.8 + 2.4 * q + vec2(0.015 * uTime, 0.0));",
    "    float fil = pow(clamp(1.0 - abs(n - 0.2) * 4.0, 0.0, 1.0), 4.0);",
    "    c = pal(hue + 0.2 * q.x, 0.5 + 0.5 * smoothstep(-0.3, 0.6, n)) + pal(hue + 0.3, 1.0) * fil * 0.5;",
    "    st = 0.25 * smoothstep(-0.3, 0.6, n) + 0.6 * fil;",
    "  } else if (fam == 1) {",
    "    float h = fbm3(p * 0.55) + 0.35 * fbm3(p * 1.7 + 3.1);",
    "    float ci = h * 7.0;",
    "    float cw = fwidth(ci) + 1e-4;",
    "    st = 0.6 * (1.0 - smoothstep(0.5 * cw, 1.5 * cw, abs(fract(ci + 0.5) - 0.5)));",
    "    c = pal(hue + 0.08, 1.0);",
    "  } else if (fam == 2) {",
    "    vec2 w = p * 0.7 + 0.9 * vec2(fbm3(p * 0.35), fbm3(p * 0.35 + 4.1));",
    "    float n1 = gnoise(w), n2 = gnoise(w * 2.3 + 1.7);",
    "    float r1 = 1.0 - smoothstep(0.0, fwidth(n1) * 1.2 + 0.025, abs(n1));",
    "    float r2 = (1.0 - smoothstep(0.0, fwidth(n2) * 1.2 + 0.015, abs(n2))) * (1.0 - smoothstep(0.0, 0.4, abs(n1)));",
    "    st = clamp(r1 + 0.8 * r2 + 0.25 * exp(-abs(n1) * 9.0), 0.0, 1.0);",
    "    c = pal(hue, 1.0);",
    "  } else if (fam == 3) {",
    "    vec2 id, rc;",
    "    vec3 v = voro(p * 1.1, id, rc);",
    "    float e = v.y - v.x;",
    "    float h = hash12(id + seed);",
    "    float ew = 0.05 + px * 1.8;",
    "    float edge = 1.0 - smoothstep(ew * 0.5, ew, e);",
    "    float nuc = (1.0 - smoothstep(0.07, 0.07 + px * 2.2, length(rc))) * step(0.35, h);",
    "    c = mix(pal(hue + 0.05, 0.95), pal(hue + 0.45, 0.9), nuc);",
    "    st = max(edge, nuc);",
    "  } else if (fam == 4) {",
    "    vec2 id, rc;",
    "    voro(p * 1.4, id, rc);",
    "    float h = hash12(id + seed), h2 = hash12(id * 1.37 + seed + 3.1);",
    "    float sz = max(px * 2.0, 0.02);",
    "    float b = pow(h, 4.0) * (0.75 + 0.25 * sin(uTime * 1.7 + h * 60.0));",
    "    float star = b / (1.0 + dot(rc, rc) / (sz * sz));",
    "    float gal = 0.0;",
    "    if (h2 > 0.8) {",
    "      vec2 g = rot(h * TAU) * rc;",
    "      g.y *= 1.3 + 1.6 * fract(h2 * 7.0);",
    "      float rr = length(g) / 0.42;",
    "      float ga = atan(g.y, g.x);",
    "      float spin = fract(h * 13.0) > 0.5 ? 1.0 : -1.0;",
    "      float arms = 0.5 + 0.5 * cos(2.0 * ga - 5.5 * spin * log(rr + 0.02));",
    "      gal = exp(-rr * 3.2) * (0.3 + 0.9 * arms * arms * arms) + 1.4 * exp(-rr * rr * 40.0);",
    "      gal *= 1.0 - smoothstep(0.6, 1.1, rr);",
    "    }",
    "    c = pal(hue + 0.1 * h, 1.0);",
    "    st = clamp(star + gal, 0.0, 1.0);",
    "  } else if (fam == 5) {",
    "    vec2 id, rc;",
    "    voro(p * 0.9, id, rc);",
    "    float h = hash12(id + seed), h2 = hash12(id * 2.1 + seed);",
    "    float k = h2 < 0.6 ? 6.0 : (h2 < 0.75 ? 12.0 : (h2 < 0.88 ? 8.0 : 5.0));",
    "    float R = 0.22 + 0.2 * h;",
    "    vec2 q = rot(h * TAU) * (-rc) / R;",
    "    float d = flake(q, k, 0.3 + 0.25 * fract(h * 7.3), 0.85 + 0.4 * fract(h * 3.7)) * R / 0.9;",
    "    float pv = px * 0.9;",
    "    float w = 0.01 + pv * 0.6;",
    "    float on = step(0.3, h);",
    "    st = clamp((1.0 - smoothstep(w, w + pv * 1.5, d)) * on + exp(-d / (0.03 + pv * 2.0)) * 0.5 * on, 0.0, 1.0);",
    "    c = pal(hue, 1.0);",
    "  } else {",
    "    vec2 w = p * 0.6 + 1.3 * vec2(fbm3(p * 0.3 + 1.0), fbm3(p * 0.3 + 5.7));",
    "    float band = w.y * 1.8 + 1.2 * fbm3(w * 0.8);",
    "    float bw = fwidth(band) + 1e-4;",
    "    st = 0.7 * (1.0 - smoothstep(0.6 * bw, 1.8 * bw + 0.01, abs(fract(band + 0.5) - 0.5)));",
    "    c = pal(hue + 0.2, 1.0);",
    "  }",
    "  return vec4(c, st);",
    "}",
    "",
    "void main(){",
    "  float pxs = 2.0 / min(uRes.x, uRes.y);",
    "  vec2 s = (gl_FragCoord.xy - 0.5 * uRes) * pxs;",
    "",
    "  // folded coarse octaves: a quadratic patch around the screen centre",
    "  float F = uP.x + dot(uP.yz, s) + 0.5 * (uPM.x * s.x * s.x + 2.0 * uPM.y * s.x * s.y + uPM.z * s.y * s.y);",
    "  vec2 gF = uP.yz + vec2(uPM.x * s.x + uPM.y * s.y, uPM.y * s.x + uPM.z * s.y);",
    "  float Q = uQ.x + dot(uQ.yz, s) + 0.5 * (uQM.x * s.x * s.x + 2.0 * uQM.y * s.x * s.y + uQM.z * s.y * s.y);",
    "",
    "  for (int k = 0; k < N; k++) {",
    "    float u = uU[k];",
    "    float sc = uB * exp2(u);",
    "    mat2 R = mat2(uR[k].x, uR[k].y, -uR[k].y, uR[k].x);",
    "    vec2 lp = uCf[k] + R * (s * sc);",
    "    // new octaves grow in at the fine end, and nothing sub-pixel is drawn",
    "    float w = (1.0 - smoothstep(KF - 1.0, KF, u)) * (1.0 - smoothstep(0.3, 0.6, sc * pxs));",
    "    float amp = w * exp2(u * uLogA);",
    "    vec3 n = noised(uCi[k], lp, uSeed[k]);",
    "    F += amp * n.x;",
    "    gF += amp * sc * (transpose(R) * n.yz);",
    "    Q += w * QA * noised(uCi[k], lp, uSeed[k] ^ 0x9e3779b9u).x;",
    "  }",
    "",
    "  float fw = max(length(gF) * pxs, 1e-6);   // field change per pixel",
    "  float land = smoothstep(-0.8 * fw, 0.8 * fw, F);",
    "",
    "  // hill shading from the analytic gradient",
    "  vec3 nrm = normalize(vec3(-gF * 0.055, 1.0));",
    "  float shade = clamp(dot(nrm, normalize(vec3(-0.55, 0.6, 0.58))), 0.0, 1.0);",
    "",
    "  vec3 earth = pal(Q, 0.28 + 0.42 * (0.5 + 0.5 * tanh(F * 0.12))) * (0.4 + 0.8 * shade);",
    "  vec3 sea = pal(Q + 0.47, 0.05 + 0.26 * exp(min(F, 0.0) * 0.22)) * (0.82 + 0.3 * shade);",
    "  vec3 col = mix(sea, earth, land);",
    "",
    "  if (uTex > 0.005) {",
    "    float hueT = Q + mix(0.47, 0.0, land);",
    "    for (int k = 0; k < N; k++) {",
    "      float u = uU[k];",
    "      float sc = uB * exp2(u);",
    "      float px = sc * pxs;",
    "      float tw = smoothstep(-3.0, -1.6, u) * (1.0 - smoothstep(KF - 2.2, KF - 1.0, u)) * (1.0 - smoothstep(0.05, 0.16, px));",

  /* ------------------------------------------------------------------ *

    "#version 300 es",
    "precision highp float;",
    "precision highp int;",

  var HG = [0, 0];

  function taylorAt(T, sx, sy, out) {

    if (!MODELS[m]) return;
    modelEl.value = m;
    try { localStorage.setItem("infinite-atlas:model", m); } catch (e) { /* storage unavailable */ }
    var fieldNow = state.model !== "julia", fieldNext = m !== "julia";
    if (fieldNow && fieldNext) {
      // Same world, textures just fade in or out.
      state.model = m;
    } else {
      transition(function () { state.model = m; state.tex = m === "textured" ? 1 : 0; });
    }
    describe();
    wake();
  }

  modelEl.addEventListener("change", function () { setModel(modelEl.value); });

  speedEl.addEventListener("input", function () {
    state.paused = false;
    showRate();
    wake();
  });

  document.getElementById("reseed").addEventListener("click", reseed);

  window.addEventListener("keydown", function (e) {
    var typing = e.target && /^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.code === "KeyR") { reseed(); return; }
    if (e.code === "KeyM" && !typing) {
      var keys = Object.keys(MODELS);
      setModel(keys[(keys.indexOf(modelEl.value) + 1) % keys.length]);
      return;
    }
    if (e.code === "Space" && !typing) {
      e.preventDefault();
      state.paused = !state.paused;
      showRate();
      wake();
    }
  });

  var idleTimer = 0;
  function wake() {
    readoutEl.classList.remove("veiled");
    barEl.classList.remove("veiled");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (barEl.contains(document.activeElement)) return;
      readoutEl.classList.add("veiled");
      barEl.classList.add("veiled");
    }, 3600);
  }
  ["pointermove", "pointerdown", "wheel", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ------------------------------------------------------------------ *
   * Sizing with adaptive resolution: if frames run slow the canvas
   * renders at a lower internal scale and is stretched to fit.
   * ------------------------------------------------------------------ */

  var MAX_PIXELS = 2400 * 1350;
  var renderScale = 1;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2) * renderScale;
    var w = Math.max(1, Math.floor(window.innerWidth * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (w * h > MAX_PIXELS) {
      var k = Math.sqrt(MAX_PIXELS / (w * h));
      w = Math.max(1, Math.floor(w * k));
      h = Math.max(1, Math.floor(h * k));
    }
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener("resize", resize);
  resize();

  var perf = { acc: 0, frames: 0 };
  function adapt(dt) {
    perf.acc += dt; perf.frames++;
    if (perf.acc < 1.5) return;
    var ms = perf.acc / perf.frames * 1000;
    perf.acc = 0; perf.frames = 0;
    var next = renderScale;
    if (ms > 30 && renderScale > 0.4) next = renderScale * 0.85;
    else if (ms < 15 && renderScale < 1) next = Math.min(1, renderScale * 1.1);
    if (next !== renderScale) { renderScale = next; resize(); }
  }

  /* ------------------------------------------------------------------ *
   * Upload and draw.
   * ------------------------------------------------------------------ */

  var bufU = new Float32Array(N), bufCi = new Int32Array(2 * N), bufCf = new Float32Array(2 * N);
  var bufR = new Float32Array(2 * N), bufSeed = new Uint32Array(N);
  var bufFam = new Float32Array(N), bufTSeed = new Float32Array(N);

  function drawField() {
    var U = fieldProg.U, n = Math.floor(field.d);
    gl.useProgram(fieldProg.prog);
    for (var k = 0; k < N; k++) {
      var L = n - KC + k, lv = field.levels.get(L);
      var ix = Math.floor(lv.cx), iy = Math.floor(lv.cy);
      bufU[k] = L - field.d;
      bufCi[2 * k] = ix; bufCi[2 * k + 1] = iy;
      bufCf[2 * k] = lv.cx - ix; bufCf[2 * k + 1] = lv.cy - iy;
      bufR[2 * k] = lv.cs; bufR[2 * k + 1] = lv.sn;
      bufSeed[k] = lv.seed; bufFam[k] = lv.fam; bufTSeed[k] = lv.tseed;
    }
    var P = field.P, Q = field.Q;
    var efr = field.d * -LOG2A; efr -= Math.floor(efr);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, state.time);
    gl.uniform1f(U.uFade, state.fade);
    gl.uniform1f(U.uB, BASE_FREQ);
    gl.uniform1f(U.uLogA, LOG2A);
    gl.uniform1f(U.uEfr, efr);
    gl.uniform1f(U.uTex, state.tex);
    gl.uniform1fv(U.uU, bufU);
    gl.uniform2iv(U.uCi, bufCi);
    gl.uniform2fv(U.uCf, bufCf);
    gl.uniform2fv(U.uR, bufR);
    gl.uniform1uiv(U.uSeed, bufSeed);
    gl.uniform1fv(U.uFam, bufFam);
    gl.uniform1fv(U.uTSeed, bufTSeed);
    gl.uniform3f(U.uP, P[0], P[1], P[2]);
    gl.uniform3f(U.uPM, P[3], P[4], P[5]);
    gl.uniform3f(U.uQ, Q[0], Q[1], Q[2]);
    gl.uniform3f(U.uQM, Q[3], Q[4], Q[5]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function drawJulia() {
    var U = juliaProg.U;
    gl.useProgram(juliaProg.prog);
    var fr = julia.D;
    var mag = SIGMA0 * Math.pow(julia.r, -fr), ang = -julia.th * fr;
    var hueOff = julia.m * 0.045, bandOff = julia.m * 0.35;
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uFade, state.fade);
    gl.uniform1f(U.uPx, mag * 2 / Math.min(canvas.width, canvas.height));
    gl.uniform1f(U.uHue, julia.hue);
    gl.uniform1f(U.uHueOff, hueOff - Math.floor(hueOff));
    gl.uniform1f(U.uBandOff, bandOff % (Math.PI * 2));
    gl.uniform2f(U.uC, julia.C[0], julia.C[1]);
    gl.uniform2f(U.uZ, julia.Z[0], julia.Z[1]);
    gl.uniform2f(U.uL, julia.L[0], julia.L[1]);
    gl.uniform2f(U.uW, mag * Math.cos(ang), mag * Math.sin(ang));
    gl.uniform2f(U.uLn, julia.Ln[0], julia.Ln[1]);
    gl.uniform1i(U.uN, julia.n);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ------------------------------------------------------------------ *
   * Frame loop.
   * ------------------------------------------------------------------ */

  var last = 0, infoClock = 0;

  function frame(now) {
    var t = now * 0.001;
    var dt = last ? Math.min(t - last, 0.1) : 0.016;
    last = t;
    state.time += dt;

    var sp = speed();

    if (state.model === "julia") {
      // D counts multiplier periods; each one is a zoom of |L|.
      julia.D += sp * dt / Math.log2(julia.r);
      while (julia.D >= 1) { julia.D -= 1; julia.m += 1; }
    } else {
      zoomField(sp * dt);
      if (!state.paused) steer(dt, sp);
      var target = state.model === "textured" ? 1 : 0;
      state.tex += (target - state.tex) * Math.min(1, dt * 1.6);
    }

    if (state.transT >= 0) {
      var before = state.transT;
      state.transT = Math.min(1, state.transT + dt / 2.0);
      if (before < 0.5 && state.transT >= 0.5 && state.transAction) {
        state.transAction();
        state.transAction = null;
        describe();
      }
      state.fade = 1 - 0.97 * Math.exp(-Math.pow((state.transT - 0.5) / 0.16, 2));
      if (state.transT >= 1) { state.transT = -1; state.fade = 1; }
    }

    if (state.model === "julia") drawJulia(); else drawField();

    infoClock -= dt;
    if (infoClock <= 0) { infoClock = 0.25; describe(); }
    adapt(dt);

    requestAnimationFrame(frame);
  }

  initField();
  newJulia();
  describe();
  showRate();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
